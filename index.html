<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0918">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l3.3 10.7L30 16l-10.7 3.3L16 30l-3.3-10.7L2 16l10.7-3.3z' fill='%23f5d38b'/%3E%3C/svg%3E">
<title>拾光之旅 · 把夜空摘成一幅画</title>
<link rel="stylesheet" href="css/style.css?v=29458680">
</head>
<body>
<div id="app" class="app">
  <div class="world" aria-hidden="true">
    <div class="sky-veil"></div>
    <div class="aurora"><span class="aurora-band a"></span><span class="aurora-band b"></span><span class="aurora-band c"></span></div>
    <div class="moon-halo"></div>
    <div class="forest" data-forest></div>
    <div class="mist"></div>
  </div>

  <section id="homeScreen" class="screen screen-home" aria-label="选关">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M22.5 4.5c-7 1.2-11.6 7.6-10.4 14.6 1.1 6.5 7 11 13.5 10.4-3.6 2.1-8 2.6-12.2 1.2C5.9 28.4 1.5 19.9 3.8 12.4 6 5.2 13.6 1.1 21 2.8c.7.1 1.2.9 1.5 1.7Z" fill="currentColor"/><circle cx="23.2" cy="8.4" r="1.8" fill="currentColor"/></svg>
      </div>
      <div>
        <p class="eyebrow">A little journey of light</p>
        <p class="brand-name">拾光之旅</p>
      </div>
      <div class="brand-count" id="homeProgress" aria-live="polite">0 / 20</div>
    </header>

    <div class="home-hero">
      <div class="hero-orbit" aria-hidden="true"></div>
      <div class="hero-cottage" data-cottage></div>
      <div class="hero-fairy" data-fairy aria-hidden="true"></div>
      <div class="home-copy">
        <h1>把夜空摘下来，<br>拼回一幅画。</h1>
        <p>小精灵住在玻璃小屋里。点开星罐，让它们把散落的星光一颗颗带回家。</p>
      </div>
    </div>

    <main class="level-list-wrap">
      <div class="level-list-head">
        <span>今夜的画</span>
        <span class="list-rule"></span>
        <span class="level-list-note">点一幅开始</span>
      </div>
      <div id="levelList" class="level-list"></div>
    </main>

    <footer class="home-foot">
      <span>免登录 · 进度只留在这台设备</span>
      <span class="home-foot-dot" aria-hidden="true"></span>
      <span>没有广告与内购</span>
    </footer>
  </section>

  <section id="playScreen" class="screen screen-play" aria-label="游戏" hidden>
    <header class="topbar">
      <button id="backHome" class="icon-btn" type="button" aria-label="回到选关">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 8 12l6.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="level-title">
        <p id="levelChapter" class="level-chapter">第一幅</p>
        <h2 id="levelName">萤溪小径</h2>
      </div>
      <div class="top-actions">
        <div class="remain" aria-live="polite"><span>剩余</span><b id="starsLeft">0</b></div>
        <button id="restartBtn" class="icon-btn" type="button" aria-label="重来本关">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5M19 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main class="play-main">
      <div class="board-stage">
        <div class="board-frame" id="boardFrame">
          <canvas id="boardCanvas" role="img" aria-label="夜空中的待摘星光画"></canvas>
        </div>
      </div>

      <div class="terrace">
        <div class="home-nook">
          <div class="nook-ground" aria-hidden="true"></div>
          <div class="cottage" id="cottage" data-cottage aria-hidden="true"></div>
          <div class="home-count" aria-live="polite"><b id="collectedCount">0</b><span>/</span><span id="totalCount">0</span></div>
        </div>
        <div class="slot-frame" id="slotFrame" aria-label="出巢位">
          <div class="slot-grid" id="slotGrid"></div>
        </div>
      </div>

      <section class="queue-card" id="queueCard" aria-label="星罐队列">
        <div class="queue-top">
          <div class="queue-label"><span class="queue-spark" aria-hidden="true"></span>星罐</div>
          <div class="queue-tip" id="queueTip">点每列最上面的罐子</div>
        </div>
        <div class="queue-grid" id="queueGrid"></div>
      </section>
      <div id="propTray" class="prop-tray" aria-label="星具"></div>
    </main>
    <div class="safe-foot" aria-hidden="true"></div>
  </section>

  <canvas id="fxCanvas" class="fx-canvas" aria-hidden="true"></canvas>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="coach" class="coach" hidden>
    <div class="coach-bubble"><p id="coachText"></p></div>
    <span class="coach-tail" aria-hidden="true"></span>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <p id="modalEyebrow" class="modal-eyebrow">原画重现</p>
      <h2 id="modalTitle">萤溪小径</h2>
      <p id="modalText" class="modal-text"></p>
      <div class="modal-painting" id="modalPainting" aria-hidden="true"></div>
      <div class="modal-actions">
        <button id="modalPrimary" class="btn btn-primary" type="button">去下一关</button>
        <button id="modalSecondary" class="btn btn-ghost" type="button">再看看</button>
      </div>
      <button id="modalClose" class="modal-x" type="button" aria-label="关闭">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div id="nextPill" class="next-pill" hidden>
    <button id="nextFromPill" class="btn btn-primary" type="button">前往下一关</button>
  </div>

  <div id="enterVeil" class="enter-veil" hidden><span class="enter-spark" aria-hidden="true"></span><span>正在点亮…</span></div>
</div>

<script src="js/cartoons.js?v=29458680"></script>
<script src="js/levels.js?v=29458680"></script>
<script src="js/engine.js?v=29458680"></script>
<script src="js/art.js?v=29458680"></script>
<script src="js/app.js?v=29458680"></script>
</body>
</html>
